<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabri3D - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="google.css">
    
    <link rel="shortcut icon" href="assets/favicon/favicon.png" type="image/png">
    
    <script src="login.js" defer></script>
   
  </head>
  <body>
    <main class="pagina-login">
      <section class="painel-marca">
        <img src="assets/logo.png" alt="Logo da Fabri3D" class="logo">
        <p class="slogan">Da solicitação à fabricação</p>
      </section>

      <section class="painel-form">
        <div class="card">
          <nav class="abas">
            <button class="aba aba-ativa" id="login">Login</button>
            <button class="aba" id="cadastrar">Cadastrar</button>
          </nav>

          <!-- Login -->
          <form class="formulario" id="formulario-login">
            <label for="email">E-mail</label>
            <div id="campo-email">
              <img src="assets/icons/email.svg" alt="" class="icone-input">
              <input id="email" type="email" placeholder="seu@email.com">
            </div>

            <label for="senha">Senha</label>
            <div id="campo-senha">
              <img src="assets/icons/senha.svg" alt="" class="icone-input">
              <input id="senha" type="password" placeholder="Digite sua senha">
            </div>

          
            <div class="container-opcoes-login">
              
              <div class="item">
                <!--Lembre de mim-->
                <div class="caixa-lembre-de-mim">
                  <input type="checkbox" name="lembre-de-mim" id="lembre-de-mim">
                  <label for="lembre-de-mim">Lembre de mim</label>
                </div>
              </div>

              <div class="item">
                <!--Esqueci minha senha-->
                <div id="esquevi-minha-senha">
                  <p class="link-esqueci-senha"><a href="#" class="link-esqueci-senha">Esqueci minha senha</a></p>
                </div>
              </div>
            </div>

            <button type="submit" class="botao-principal">Entrar</button>
            
                        
                <div id="separador">
                  <hr class="linha-separadora">
                    <p id="mensagem-separadora">Ou</p>
                  <hr class="linha-separadora">
                </div>

<!--Botão google-->
                <button class="gsi-material-button">
  <div class="gsi-material-button-state"></div>
  <div class="gsi-material-button-content-wrapper">
    <div class="gsi-material-button-icon">
      <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
        <path fill="none" d="M0 0h48v48H0z"></path>
      </svg>
    </div>
    <span class="gsi-material-button-contents">Fazer login com o Google</span>
    <span style="display: none;">Sign in with Google</span>
  </div>
                </button>
    </form>

          <!-- Cadastro -->
          <form class="formulario" id="formulario-cadastro" hidden>
            <label for="nome" hidden>Nome</label>
            <div id="campo-nome" class="campo-nome" hidden>
              <img src="assets/icons/usuario.svg" alt="" class="icone-input">
              <input id="nome" type="text" placeholder="Digite seu nome">
            </div>

            <label for="sobrenome" hidden>Sobrenome</label>
            <div id="campo-sobrenome" class="campo-nome" hidden>
              <img src="assets/icons/usuario.svg" alt="" class="icone-input">
              <input id="sobrenome" type="text" placeholder="Digite seu sobrenome">
            </div>

            <label for="email-cadastro" hidden>E-mail</label>
            <div id="campo-email-cadastro" hidden>
              <img src="assets/icons/email.svg" alt="" class="icone-input">
              <input id="email-cadastro" type="email" placeholder="seu@email.com">
            </div>

            <div id="campo-confirmar-email" hidden>
              <h3>Digite o código enviado para seuemail@exemplo.com</h3>
              <div id="codigo-container">
                <input type="text" class="codigo-input" maxlength="1" >
                <input type="text" class="codigo-input" maxlength="1" >
                <input type="text" class="codigo-input" maxlength="1" >
                <input type="text" class="codigo-input" maxlength="1" >
                <input type="text" class="codigo-input" maxlength="1" >
              </div>
            </div>

            <label for="senha-cadastro" hidden>Senha</label>
            <div id="campo-senha-cadastro" hidden>
              <img src="assets/icons/senha.svg" alt="" class="icone-input">
              <input id="senha-cadastro" type="password" placeholder="Digite sua senha">
            </div>

            <label for="confirmar-senha" hidden>Confirmar Senha</label>
            <div id="campo-confirmar-senha" hidden>
              <img src="assets/icons/senha.svg" alt="" class="icone-input">
              <input id="confirmar-senha" type="password" placeholder="Confirme sua senha">
            </div>

            <div id="botoes-navegacao">
              <div id="voltar-cadastro" hidden>
                <button type="button" class="botao-ir-vir" id="botao-voltar" hidden>
                  <img src="assets/icons/seta-esquerda.svg" alt="" id="seta-voltar">
                  Voltar
                </button>
              </div>
              <div id="proximo-cadastro" hidden>
                <button type="button" class="botao-ir-vir" id="botao-proximo">
                  Próximo
                  <img src="assets/icons/seta-direita.svg" alt="" id="seta-proximo">
                </button>
              </div>
              
              
              <button type="submit" class="botao-principal" id="confirmar_cadastrar" hidden>Cadastrar</button>
            </div>
            
            <div id="separador-cadastro" hidden>
              <hr class="linha-separadora">
                <p id="mensagem-separadora">Ou</p>
              <hr class="linha-separadora">
            </div>
            
          </form>        
            <p class="rodape-card">Ao continuar, você concorda com os termos de uso e a política de privacidade do Fabri3D.</p>
        </div>
      </section>
    </main>
  </body>
</html>
